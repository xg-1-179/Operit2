name: Operness Performance Checks

on:
  workflow_dispatch:
  push:
    branches: [build/operness-2.0.0-20]
    paths:
      - .github/workflows/operness-performance-check.yml
      - apps/flutter/**
      - tools/tests/android_ui_thread_contracts.test.mjs

permissions:
  contents: read

jobs:
  flutter-regressions:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTFLAGS: -Awarnings
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Install project Flutter SDK
        shell: pwsh
        working-directory: apps/flutter/app
        run: |
          dart pub global activate fvm 4.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { Join-Path $env:LOCALAPPDATA 'Pub/Cache' }
          & (Join-Path $pubCache 'bin/fvm.bat') install --skip-pub-get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE/apps/flutter/app/.fvm/flutter_sdk/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Prepare pinned dependencies
        shell: pwsh
        run: python tools/build_scripts/prepare_android_ci_dependencies.py
      - name: Resolve app dependencies
        shell: pwsh
        working-directory: apps/flutter/app
        run: flutter pub get --enforce-lockfile
      - name: Analyze UI and run interaction regressions
        shell: pwsh
        working-directory: apps/flutter/packages/operit_ui
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze lib/src/render/chat_input_surface.dart lib/src/render/composer_popup_surface.dart lib/src/render/composer_chrome.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/input_glass_interaction_test.dart test/composer_popup_transition_test.dart test/composer_press_feedback_test.dart
      - name: Generate application proxy contracts
        id: proxy
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo check --manifest-path core/crates/proxy/local/Cargo.toml --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('CoreProxyClients.g.dart', 'CoreProxyModels.g.dart')) {
            if (!(Test-Path "apps/flutter/app/lib/core/proxy/generated/$file")) {
              throw "Missing generated proxy contract: $file"
            }
          }
      - name: Analyze app and run rendering regressions
        if: ${{ !cancelled() && steps.proxy.outcome == 'success' }}
        shell: pwsh
        working-directory: apps/flutter/app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare application build hook dependencies
        id: hook
        if: ${{ !cancelled() && steps.proxy.outcome == 'success' }}
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@10.7.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location plugins/packages/buildin/workflow
          try {
            corepack pnpm install --frozen-lockfile --prod=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Run application rendering regressions
        if: ${{ !cancelled() && steps.proxy.outcome == 'success' && steps.hook.outcome == 'success' }}
        shell: pwsh
        working-directory: apps/flutter/app
        run: |
          flutter test test/client_logger_batching_test.dart test/runtime_bootstrap_logging_test.dart test/idle_rendering_test.dart test/markdown_reveal_cache_test.dart test/page_transition_lifecycle_test.dart test/phone_page_transition_test.dart test/phone_layout_test.dart
      - name: Check Android worker contracts and plugin regressions
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          npm ci --prefix tools/dsh-compat --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tools/tests/android_ui_thread_contracts.test.mjs tools/dsh-compat/tests/*.test.mjs
